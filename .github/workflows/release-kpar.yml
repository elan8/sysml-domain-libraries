name: Release KPAR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pack-kpar:
    name: Pack and release domain libraries KPAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout domain libraries
        uses: actions/checkout@v6

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate with the pinned Spec42 release
        run: python3 scripts/validate_spec42.py

      - name: Bundle KPAR and Modelica package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="elan8-domain-libraries-${VERSION}.kpar"
          python3 scripts/bundle_kpar.py --version "${VERSION}" --output "${ARTIFACT}"
          MODELICA="elan8-domain-modelica-${VERSION}.zip"
          python3 scripts/bundle_modelica.py --version "${VERSION}" --output "${MODELICA}"
          sha256sum "${ARTIFACT}" "${MODELICA}" > SHA256SUMS.txt
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"
          echo "MODELICA=${MODELICA}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if [[ -z "${ARTIFACT:-}" || ! -f "${ARTIFACT}" ]]; then
            echo "Missing packed KPAR artifact: '${ARTIFACT:-}'" >&2
            exit 1
          fi
          if [[ -z "${MODELICA:-}" || ! -f "${MODELICA}" ]]; then
            echo "Missing packed Modelica archive: '${MODELICA:-}'" >&2
            exit 1
          fi
          gh release create "${TAG}" \
            --title "Domain libraries ${TAG}" \
            --notes "KerML Project Archive (KPAR) release of Elan8 domain libraries ${TAG}, validated and bundled with Spec42 $(cat .spec42-version). The Modelica package the parts bind to is in ${MODELICA}." \
            "${ARTIFACT}" \
            "${MODELICA}" \
            SHA256SUMS.txt
