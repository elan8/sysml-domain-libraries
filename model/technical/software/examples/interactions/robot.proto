syntax = "proto3";
package demo.robot.v1;

service RobotControl {
  rpc GetStatus(GetStatusRequest) returns (RobotStatus);
  rpc StartCleaning(StartCleaningRequest) returns (StartCleaningResult);
}

service DiagnosticsService {
  rpc GetDiagnostics(GetDiagnosticsRequest) returns (Diagnostics);
}

message GetStatusRequest {}
message Position {
  double x = 1;
  double y = 2;
}
message RobotStatus {
  bool cleaning = 1;
  Position position = 2;
}
message StartCleaningRequest {}
message StartCleaningResult { bool accepted = 1; }
message GetDiagnosticsRequest {}
message Diagnostics { bool healthy = 1; }
